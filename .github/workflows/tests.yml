name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install . httpx pytest-subtests
      - name: Run backend gate tests
        run: >-
          python -m pytest -vv --durations=10 -o faulthandler_timeout=60
          tests/test_live_data_isolation.py
          tests/test_instrument_eligibility.py
          tests/test_instrument_cutoff.py
          tests/test_data_preflight.py
          tests/test_p0_research_gate.py
          tests/test_research_cutoff.py
          tests/test_sec_statements.py
          tests/test_news_publication_times.py
          tests/test_point_in_time_data.py
          tests/test_price_asof_units.py
          tests/test_frozen_inputs.py
          tests/test_source_snapshots.py
          tests/test_snapshot_api.py
          tests/test_checkpoint_mode_isolation.py
          tests/test_memory_mode_isolation.py
          tests/test_financial_claim_verification.py
          tests/test_qualitative_verification.py
          tests/test_report_quality_gate.py
          tests/test_reporting_snapshot_export.py
          tests/test_job_recovery.py
          tests/test_job_controls.py
          tests/test_research_usage.py
          tests/test_research_reliability_evaluation.py
          tests/test_chatgpt_plan_auth.py
          tests/test_chatgpt_plan_probe.py
          tests/test_chatgpt_plan_cli.py
          tests/test_cli_package.py
          tests/test_cli_interactive.py
          tests/test_research_scope.py
          tests/test_revision_comparison.py
          tests/test_structured_agents.py
          tests/test_workflow.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node --test tests/frontend-workbench.test.cjs tests/static-ui.test.cjs tests/static-review.test.cjs
      - run: npm run build
        working-directory: frontend
