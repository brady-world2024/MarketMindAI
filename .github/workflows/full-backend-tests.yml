name: Full backend tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Full backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install . httpx pytest-subtests
      - name: Run all backend tests
        run: python -m pytest -vv --durations=25 -o faulthandler_timeout=60
